# Deterministic CI — runs on every PR (and pushes to main). No secrets required.
# Claude-powered reviews (/eval etc.) stay local via the evidence-gated hooks until
# calibrated (cadence table: CLAUDE.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        run: xcodebuild -version && swift --version

      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify

      - name: Generate project (project.yml is the source of truth — ADR-0001)
        run: xcodegen generate

      # Drift guard: the committed .xcodeproj must equal what project.yml generates, so a reviewer who
      # opens the committed project (without running xcodegen) gets exactly what CI builds. CI previously
      # masked drift by regenerating first; this makes drift a hard failure.
      - name: Verify committed .xcodeproj is not stale
        run: |
          if ! git diff --quiet MedalCase.xcodeproj/project.pbxproj; then
            echo "::error::Committed MedalCase.xcodeproj is stale vs project.yml — run 'xcodegen generate' and commit."
            git diff --stat MedalCase.xcodeproj/project.pbxproj
            exit 1
          fi
          echo "✓ committed .xcodeproj matches project.yml"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project MedalCase.xcodeproj -scheme MedalCase

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for r,a in d.items() if 'iOS' in r for x in a if 'iPhone' in x['name']))")
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # App integration + XCUITest run in CI. Snapshots are renderer-pinned (ADR-0009) — skipped here,
      # run locally + in the pre-push gate.
      - name: Build & test (app integration + UI; snapshots skipped)
        run: |
          set -o pipefail
          xcodebuild test \
            -project MedalCase.xcodeproj \
            -scheme MedalCase \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skip-testing:MedalCaseSnapshotTests \
            -resultBundlePath TestResults.xcresult \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

  lint:
    name: Lint & format
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: brew install swiftlint swiftformat
      - name: SwiftFormat (lint mode)
        run: swiftformat --lint .
      - name: SwiftLint (strict)
        run: swiftlint --strict

  package-tests:
    # The app scheme's xcodebuild covers the app target; the package-level unit tests
    # (domain/data/design/feature logic) live in the SPM packages and run via `swift test`.
    # Packages land per milestone (M3–M5); the guard keeps CI green until each exists.
    name: Package tests
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package: [MedalDomain, DesignSystem, MedalData, MedalTestSupport, AchievementsFeature]
    steps:
      - uses: actions/checkout@v5
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: swift test/build — ${{ matrix.package }}
        run: |
          PKG="Modules/${{ matrix.package }}"
          if [ ! -d "$PKG" ]; then
            echo "$PKG not yet created (lands in M3–M5) — skipping."
            exit 0
          fi
          # Test-support packages carry no test target; compile-check them instead (ADR-0009).
          if ls "$PKG"/Tests/*/ >/dev/null 2>&1; then
            swift test --package-path "$PKG"
          else
            swift build --package-path "$PKG"
          fi
