# MedalCase — XcodeGen project definition (ADR-0001).
#
# This file is the SOURCE OF TRUTH for `MedalCase.xcodeproj`. The generated project is committed so
# a reviewer can clone → open → Run with no setup tool; contributors regenerate after structural
# changes with:  xcodegen generate
#
# The app target is a thin composition root; all logic lives in the local SPM packages under
# `Modules/` (see tech_specs/01-architecture.md). Packages and test targets land per milestone
# (M3–M7) and are added here as they do. Deployment iOS 17 (ADR-0005); Swift 6 strict concurrency.

name: MedalCase

options:
  bundleIdPrefix: com.runkeeper
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

# Local SPM packages under Modules/ (ADR-0003). Added per milestone as they land: M3 → MedalDomain +
# DesignSystem. The App target links them so the iOS build (incl. the DesignSystem asset catalog) is
# validated in CI; feature wiring into the composition root happens in M6.
packages:
  MedalDomain:
    path: Modules/MedalDomain
  DesignSystem:
    path: Modules/DesignSystem

targets:
  MedalCase:
    type: application
    platform: iOS
    sources:
      - path: MedalCase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runkeeper.MedalCase
        PRODUCT_NAME: MedalCase
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # The medal case is a portrait screen (per the mock); Runkeeper is portrait-primary.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    dependencies:
      - package: MedalDomain
      - package: DesignSystem

schemes:
  MedalCase:
    build:
      targets:
        MedalCase: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
